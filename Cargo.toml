[package]
name = "python-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bundle a Python project into one file and run it on any machine that has Python"

[[bin]]
name = "pyrs"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
directories = "6.0.0"
pep440_rs = "0.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tempfile = "3.27.0"
which = "8.0.6"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
